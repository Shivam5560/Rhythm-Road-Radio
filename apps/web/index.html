<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>रास्ता रेडियो — सफ़र, बारिश, जश्न, महफ़िल</title>
    <meta
      name="description"
      content="चार मोड, चार रास्ते — लद्दाख की चढ़ाई, मानसून की पगडंडी, गोवा की रात और बर्थ की महफ़िल। हर मोड़ पर एक नई धुन।"
    />
    <meta name="theme-color" content="#241610" />

    <!--
      Link previews drop relative URLs, so every social image and URL below has
      to be absolute. SITE ORIGIN ASSUMED: update these four absolute URLs if the
      site is served from a domain other than the one below.
    -->
    <link rel="canonical" href="https://rasta-audio.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="रास्ता रेडियो" />
    <meta property="og:locale" content="hi_IN" />
    <meta property="og:title" content="रास्ता रेडियो" />
    <meta
      property="og:description"
      content="चार मोड, चार रास्ते। हर मोड़ पर एक नई धुन।"
    />
    <meta property="og:url" content="https://rasta-audio.vercel.app/" />
    <!-- Bump ?v= whenever the image changes: WhatsApp, iMessage and X cache
         link previews for weeks and key that cache on the URL. -->
    <meta property="og:image" content="https://rasta-audio.vercel.app/opengraph.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="लेह–मनाली हाईवे के मोड़ पर चढ़ती लाल बस, ऊपर प्रार्थना ध्वज।"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="रास्ता रेडियो" />
    <meta name="twitter:description" content="चार मोड, चार रास्ते। हर मोड़ पर एक नई धुन।" />
    <meta name="twitter:image" content="https://rasta-audio.vercel.app/opengraph.jpg?v=1" />
    <meta
      name="twitter:image:alt"
      content="लेह–मनाली हाईवे के मोड़ पर चढ़ती लाल बस, ऊपर प्रार्थना ध्वज।"
    />

    <!-- %BASE_URL% so the icon survives a non-root deploy, which this repo's
         vite config allows via BASE_PATH. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%opengraph.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
