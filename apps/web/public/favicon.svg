<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="रास्ता रेडियो">
  <!--
    Kept geometric rather than lettered on purpose: an SVG favicon renders with
    system fonts, and a Devanagari glyph would fall back to tofu anywhere the
    script is not installed. A low sun behind a ridge with the road running out
    of frame still reads at 16px, which a curve or a wordmark would not.
  -->
  <rect width="32" height="32" rx="7" fill="#241610"/>
  <circle cx="19" cy="13" r="6.5" fill="#e2673f"/>
  <path d="M0 24 L7 15 L12.5 21 L18 13.5 L25 22 L32 16 L32 32 L0 32 Z" fill="#f3d9a8"/>
  <path d="M8 32 Q13 26 20 25.5" stroke="#241610" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
